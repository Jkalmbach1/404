<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="403 - Access Forbidden on Kalmbach.us">
  <title>403 &mdash; Access Forbidden</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #070c1e;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .error-code {
      font-size: clamp(5rem, 22vw, 11rem);
      font-weight: 800;
      color: #38bdf8;
      line-height: 1;
      letter-spacing: -0.04em;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 700;
      color: #f1f5f9;
      margin: 1rem 0 0.5rem;
    }
    p {
      max-width: 440px;
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      line-height: 1.5;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #070c1e;
      background: #38bdf8;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
      min-height: 44px;
      min-width: 140px;
    }
    .btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>
  <div class="error-code">403</div>
  <h1>Access Forbidden</h1>
  <p>You do not have permission to access the requested resource on Kalmbach.us.</p>
  <a href="https://kalmbach.us" class="btn">Return Home</a>
</body>
</html>
