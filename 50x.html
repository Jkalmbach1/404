<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="500 - Internal Server Error on Kalmbach.us">
  <title>500 &mdash; Internal Server Error</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #070c1e;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .error-code {
      font-size: clamp(5rem, 22vw, 11rem);
      font-weight: 800;
      color: #ef4444;
      line-height: 1;
      letter-spacing: -0.04em;
      text-shadow: 0 0 40px rgba(239, 68, 68, 0.25);
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 700;
      color: #f1f5f9;
      margin: 1rem 0 0.5rem;
    }
    p {
      max-width: 440px;
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      line-height: 1.5;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: #ef4444;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
      min-height: 44px;
      min-width: 140px;
    }
    .btn:hover {
      background: #f87171;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>
  <div class="error-code">500</div>
  <h1>Server Error</h1>
  <p>The server encountered an unexpected error. Please check system status or try again shortly.</p>
  <a href="https://status.kalmbach.us" class="btn">Check Status</a>
</body>
</html>
